
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Elon-themed Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Alex-Roberts27
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B22222&color_dots=%23FCE8EC,%23F5B7C5,%23D96A82,%23B22222,%237A001D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%234A2630,%237A001D,%23B22222,%23D99B00,%23FFD700

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
